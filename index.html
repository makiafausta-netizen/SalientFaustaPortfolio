
<!-- Portfolio updates -->

<style>
  /* Square headshot */
  .hero-visual .portrait-frame {
    aspect-ratio: 1 / 1 !important;
    overflow: hidden;
  }

  .hero-visual .portrait-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Email contact window */
  #contact-email-dialog {
    border: 1px solid #e9d9e7;
    border-radius: 12px;
    padding: 28px;
    width: min(420px, 90vw);
    background: white;
    color: #302637;
    box-shadow: 0 20px 60px #0003;
  }

  #contact-email-dialog::backdrop {
    background: #0008;
  }

  #contact-email-dialog a {
    display: block;
    margin: 12px 0;
    padding: 12px;
    border: 1px solid #e8d8e8;
    border-radius: 6px;
    color: #523459;
    text-decoration: none;
  }

  #contact-email-dialog a:hover {
    background: #f9f0f8;
  }

  #close-contact-email {
    padding: 10px 18px;
    cursor: pointer;
  }
</style>

<dialog id="contact-email-dialog">
  <h3>Get in touch</h3>
  <p>Choose how you would like to send an email.</p>

  <a href="https://mail.google.com/mail/?view=cm&fs=1&to=sfmakiankonghoenoh%40widener.edu"
     target="_blank" rel="noopener noreferrer">
    Compose in Gmail
  </a>

  <a href="https://outlook.office.com/mail/deeplink/compose?to=sfmakiankonghoenoh%40widener.edu"
     target="_blank" rel="noopener noreferrer">
    Compose in Outlook
  </a>

  <a href="mailto:sfmakiankonghoenoh@widener.edu">
    Use default email app
  </a>

  <button id="close-contact-email" type="button">
    Close
  </button>
</dialog>

<script>
  // Remove GitHub links from the website.
  document.querySelectorAll('a[href*="github.com"]')
    .forEach(link => link.remove());

  // Connect email buttons to the contact window.
  const existingEmailDialog =
    document.getElementById("email-dialog");

  if (!existingEmailDialog) {
    const dialog =
      document.getElementById("contact-email-dialog");

    document.querySelectorAll(
      '.actions a[href^="mailto:"], ' +
      '.contact-actions a[href^="mailto:"]'
    ).forEach(link => {
      link.addEventListener("click", event => {
        event.preventDefault();
        dialog.showModal();
      });
    });

    document.getElementById("close-contact-email")
      .addEventListener("click", () => dialog.close());

    dialog.addEventListener("click", event => {
      if (event.target === dialog) dialog.close();
    });
  }
</script>
